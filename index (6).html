<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Dirty Soda — Business HQ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --ink: #1a1a1a; --ink-soft: #666666;
    --primary: #1a1a1a; --primary-dark: #000000; --accent: #444444; --accent-soft: #f2f2f2;
    --danger: #a3372f; --success: #2f6b48; --border: #dddddd; --radius: 4px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; min-height:100vh; }
  header { background:#ffffff; color:var(--ink); padding:16px 24px; border-bottom:1px solid var(--border); }
  .head-row { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; max-width:1200px; margin:0 auto; }
  .brand-lockup { display:flex; align-items:center; gap:14px; }
  .brand-lockup img { height:44px; width:44px; border-radius:4px; object-fit:cover; border:1px solid var(--border); }
  h1 { font-size:1.1rem; margin:0; color:var(--ink); font-weight:700; } h1 span { color:var(--ink); font-weight:400; }
  .subtitle { font-size:.75rem; color:var(--ink-soft); margin-top:1px; }
  .me-chip { display:flex; align-items:center; gap:10px; background:#fafafa; border:1px solid var(--border); padding:6px 12px; border-radius:var(--radius); font-size:.83rem; color:var(--ink); }
  .me-chip button { background:#f2f2f2; border:1px solid var(--border); color:var(--ink); border-radius:4px; padding:4px 10px; font-size:.72rem; cursor:pointer; font-weight:600; }
  nav { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap; }
  nav .inner { display:flex; max-width:1200px; margin:0 auto; padding:0 8px; }
  nav button { background:none; border:none; padding:13px 16px; font-size:.82rem; font-weight:500; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.active { color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  main { max-width:1200px; margin:0 auto; padding:18px 16px 60px; }
  .panel { display:none; } .panel.active { display:block; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 4px; font-size:1.05rem; } .card .sub { color:var(--ink-soft); font-size:.82rem; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .row:last-child { border-bottom:none; }
  .row.done .title { text-decoration:line-through; color:var(--ink-soft); }
  .row .title { flex:1; font-size:.94rem; min-width:140px; } .row .meta { font-size:.76rem; color:var(--ink-soft); width:100%; }
  .pill { display:inline-block; padding:2px 9px; border-radius:4px; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .pill.needed,.pill.pending,.pill.unpaid { background:#fbe3e0; color:var(--danger); }
  .pill.bought,.pill.done,.pill.paid,.pill.confirmed { background:#ddeee1; color:var(--success); }
  .pill.progress { background:var(--accent-soft); color:#8a6a1a; }
  button.mini { background:#f0f0f0; color:var(--ink); border:1px solid #ccc; border-radius:4px; padding:7px 14px; font-size:.78rem; font-weight:600; cursor:pointer; }
  button.mini:hover { background:#e4e4e4; }
  button.mini.ghost { background:#fff; color:var(--danger); border:1px solid var(--border); }
  select,input,textarea { font-family:inherit; font-size:.87rem; padding:8px 10px; border-radius:4px; border:1px solid var(--border); background:var(--bg); color:var(--ink); width:100%; }
  select:focus,input:focus,textarea:focus { outline:2px solid #888; outline-offset:-1px; }
  .add-form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .add-form input,.add-form select { flex:1; min-width:110px; }
  input[type=checkbox] { width:20px; height:20px; accent-color:#1a1a1a; flex-shrink:0; }
  .empty { color:var(--ink-soft); font-size:.88rem; padding:10px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }
  .statrow { display:flex; justify-content:space-around; text-align:center; flex-wrap:wrap; gap:10px; }
  .stat .num { font-size:1.6rem; font-weight:700; color:var(--ink); } .stat .label { font-size:.74rem; color:var(--ink-soft); }
  .tag { display:inline-block; background:#eeeeee; color:#444444; padding:2px 9px; border-radius:4px; font-size:.72rem; font-weight:600; margin-right:6px; }
  .badge-elig { font-size:.72rem; padding:2px 8px; border-radius:4px; font-weight:600; }
  .badge-elig.yes { background:#e3f0e7; color:var(--success); } .badge-elig.check { background:#eeeeee; color:#555555; }
  textarea { min-height:56px; resize:vertical; }
  #authScreen { max-width:400px; margin:80px auto; padding:0 16px; }
  #authScreen .card { text-align:left; border-radius:var(--radius); }
  #authScreen h1 { color:var(--ink); text-align:center; margin-bottom:2px; font-size:1.3rem; }
  #authScreen .sw { text-align:center; margin-top:10px; font-size:.85rem; }
  #authScreen .sw a { color:#1a1a1a; cursor:pointer; text-decoration:underline; }
  .err { color:var(--danger); font-size:.82rem; margin-top:6px; }
  .full-btn { width:100%; margin-top:8px; }
  #appRoot { display:none; }
</style>
</head>

// ---------------- PASSCODE GATE ----------------
async function handlePasscodeSubmit(){
  const name = document.getElementById('authNameGate').value.trim();
  const code = document.getElementById('authPasscode').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  errEl.style.color = 'var(--danger)';
  if (!name) { errEl.textContent = 'Enter your name.'; return; }
  if (code !== SITE_PASSCODE) { errEl.textContent = 'Wrong passcode.'; return; }
  try {
    // Establish an anonymous Supabase session so the database's "signed-in only" rules allow reads/writes,
    // without needing individual email/password accounts.
    const { data: existing } = await sb.auth.getSession();
    if (!existing.session) {
      const { error } = await sb.auth.signInAnonymously();
      if (error) throw error;
    }
    localStorage.setItem('vds_name', name);
    localStorage.setItem('vds_unlocked', '1');
    enterApp(name);
  } catch (e) {
    errEl.textContent = 'Could not connect: ' + (e.message || 'unknown error');
  }
}
function enterApp(name){
  currentUser = { name };
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('meName').textContent = name;
  boot();
}
async function doSignOut(){
  localStorage.removeItem('vds_unlocked');
  location.reload();
}

// On load: if already unlocked on this device, skip straight in (re-establishing the anonymous session quietly)
(async function initGate(){
  const savedName = localStorage.getItem('vds_name');
  const unlocked = localStorage.getItem('vds_unlocked');
  if (unlocked && savedName) {
    try {
      const { data: existing } = await sb.auth.getSession();
      if (!existing.session) {
        const { error } = await sb.auth.signInAnonymously();
        if (error) throw error;
      }
      enterApp(savedName);
    } catch (e) {
      // fall back to showing the passcode screen
    }
  }
})();

let booted = false;
function boot(){
  if (booted) return;
  booted = true;
  buildTabs();
  subscribeAll();
  showTab('dashboard');
}
function buildTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  TABS.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.label; b.dataset.tab = t.id;
    if (i===0) b.classList.add('active');
    b.onclick = () => showTab(t.id);
    bar.appendChild(b);
  });
}
function showTab(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  renderAll();
}
function activeTab(){ const el=document.querySelector('nav button.active'); return el?el.dataset.tab:'dashboard'; }

// ---------------- SUBSCRIPTIONS (initial load + realtime) ----------------
function subscribeAll(){
  const tables = [
    ['todos','todos'], ['shopping_items','shopping'], ['calendar_events','calendar'],
    ['compliance_items','compliance'], ['recipes','recipes'], ['menu_items','menu'],
    ['bookkeeping','bookkeeping'], ['inventory_items','inventory'], ['recipe_ingredients','recipeIngredients'],
    ['sales','sales'], ['booking_requests','bookings'], ['shifts','shifts'], ['customers','customers']
  ];
  tables.forEach(([table, key]) => {
    loadTable(table, key);
    sb.channel('rt-'+table)
      .on('postgres_changes', { event:'*', schema:'public', table }, () => loadTable(table, key))
      .subscribe();
  });
  loadOwnership();
  sb.channel('rt-business_meta')
    .on('postgres_changes', { event:'*', schema:'public', table:'business_meta' }, () => loadOwnership())
    .subscribe();
}
async function loadTable(table, key){
  const { data, error } = await sb.from(table).select('*').order('created_at', { ascending:false });
  if (!error) { state[key] = data || []; renderAll(); }
}
async function loadOwnership(){
  const { data } = await sb.from('business_meta').select('*').eq('id','ownership').maybeSingle();
  state.ownership = data || null;
  renderAll();
}
function renderAll(){
  const t = activeTab();
  if (t==='dashboard') renderDashboard();
  if (t==='todo') renderTodo();
  if (t==='shopping') renderShopping();
  if (t==='inventory') renderInventory();
  if (t==='calendar') renderCalendar();
  if (t==='compliance') renderCompliance();
  if (t==='menu') renderMenu();
  if (t==='sales') renderSales();
  if (t==='bookkeeping') renderBookkeeping();
  if (t==='staff') renderStaff();
  if (t==='customers') renderCustomers();
  if (t==='ownership') renderOwnership();
}

          ${r.steps?`<div class="meta"><b>Steps:</b> ${esc(r.steps)}</div>`:''}
          ${renderRecipeInventoryLinks(r.id)}</div>
          <button class="mini ghost" onclick="deleteRow('recipes','${r.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No recipes added yet.</div>'}
    </div>`;
}
function renderRecipeInventoryLinks(recipeId){
  const links = state.recipeIngredients.filter(ri=>ri.recipe_id===recipeId);
  if (!links.length) return '';
  return '<div class="meta"><b>Uses:</b> ' + links.map(l=>{
    const inv = state.inventory.find(i=>i.id===l.inventory_item_id);
    return inv ? `${esc(inv.name)} (${esc(l.qty_per_serving)} ${esc(inv.unit||'')})` : '';
  }).filter(Boolean).join(', ') + '</div>';
}
async function addMenu(){
  const name = document.getElementById('menuName').value.trim(); if(!name) return;
  const category = document.getElementById('menuCategory').value.trim() || 'Other';
  const price = document.getElementById('menuPrice').value.trim();
  const cost = parseFloat(document.getElementById('menuCost').value)||null;
  const recipe_id = document.getElementById('menuRecipe').value || null;
  await sb.from('menu_items').insert({ name, category, price, cost, recipe_id });
  ['menuName','menuCategory','menuPrice','menuCost'].forEach(id=>document.getElementById(id).value='');
}
async function addRecipe(){
  const name = document.getElementById('recName').value.trim(); if(!name) return;
  const ingredients = document.getElementById('recIngredients').value.trim();
  const steps = document.getElementById('recSteps').value.trim();
  await sb.from('recipes').insert({ name, ingredients, steps });
  document.getElementById('recName').value=''; document.getElementById('recIngredients').value=''; document.getElementById('recSteps').value='';
}

// ---------------- SALES ----------------
function renderSales(){
  const items = state.sales;
  const menuOptions = state.menu.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  const eventOptions = state.calendar.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const today = items.filter(s=>(s.created_at||'').slice(0,10)===todayStr());
  const todayTotal = today.reduce((a,b)=>a+(Number(b.total)||0),0);
  document.getElementById('panel-sales').innerHTML = `
    <div class="card">
      <h2>Sales Log</h2>
      <div class="sub">Log each sale — today's total: <b>${fmtMoney(todayTotal)}</b> (${today.length} sales)</div>
      <div class="add-form" style="flex-wrap:wrap;">
        <input list="menuList" type="text" id="saleItem" placeholder="Item name">
        <datalist id="menuList">${menuOptions}</datalist>
        <input type="number" id="saleQty" placeholder="Qty" value="1" min="1">
        <input type="number" step="0.01" id="salePrice" placeholder="Unit price $">
        <select id="saleEvent"><option value="">No event linked</option>${eventOptions}</select>
        <select id="salePayment"><option value="card">Card</option><option value="cash">Cash</option><option value="other">Other</option></select>
        <button class="mini" onclick="addSale()">Log sale</button>
      </div>
      ${items.length ? items.slice(0,30).map(s=>`
        <div class="row">
          <div style="flex:1"><div class="title">${esc(s.item_name)} × ${esc(s.quantity)} — ${fmtMoney(s.total)}</div>
          <div class="meta">${(s.created_at||'').slice(0,16).replace('T',' ')} · ${esc(s.payment_method||'')}${s.sold_by?' · '+esc(s.sold_by):''}</div></div>
          <button class="mini ghost" onclick="deleteRow('sales','${s.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No sales logged yet.</div>'}
    </div>`;
}
async function addSale(){
  const item_name = document.getElementById('saleItem').value.trim(); if(!item_name) return;
  const quantity = parseInt(document.getElementById('saleQty').value)||1;
  const unit_price = parseFloat(document.getElementById('salePrice').value)||0;
  const event_id = document.getElementById('saleEvent').value || null;
  const payment_method = document.getElementById('salePayment').value;
  const total = unit_price * quantity;
  const menuItem = state.menu.find(m=>m.name.toLowerCase()===item_name.toLowerCase());
  await sb.from('sales').insert({ item_name, category: menuItem?menuItem.category:null, quantity, unit_price, total, payment_method, event_id, sold_by: currentUser.name });
  // best-effort inventory depletion via linked recipe
  try {
    if (menuItem && menuItem.recipe_id) {
      const links = state.recipeIngredients.filter(ri=>ri.recipe_id===menuItem.recipe_id);
      for (const l of links) {
        const inv = state.inventory.find(i=>i.id===l.inventory_item_id);
        if (inv) {
          const newQty = Number(inv.qty_on_hand) - (Number(l.qty_per_serving)*quantity);
          await sb.from('inventory_items').update({ qty_on_hand: newQty }).eq('id', inv.id);
        }
      }
    }
  } catch(e) { /* non-blocking */ }
  document.getElementById('saleItem').value=''; document.getElementById('salePrice').value=''; document.getElementById('saleQty').value='1';
}

// ---------------- BOOKKEEPING ----------------
function renderBookkeeping(){
  const items = state.bookkeeping;
  const income = items.filter(x=>x.type==='income').reduce((a,b)=>a+(Number(b.amount)||0),0);
  const expense = items.filter(x=>x.type==='expense').reduce((a,b)=>a+(Number(b.amount)||0),0);
  const salesTotal = state.sales.reduce((a,b)=>a+(Number(b.total)||0),0);
  document.getElementById('panel-bookkeeping').innerHTML = `
    <div class="card">
      <h2>Bookkeeping</h2>
      <div class="sub">Not a tax filing tool — use a licensed preparer for that.</div>
      <div class="statrow">
        <div class="stat"><div class="num">${fmtMoney(income)}</div><div class="label">Manual income entries</div></div>
        <div class="stat"><div class="num">${fmtMoney(salesTotal)}</div><div class="label">Logged sales total</div></div>
        <div class="stat"><div class="num">${fmtMoney(expense)}</div><div class="label">Total expenses</div></div>
        <div class="stat"><div class="num">${fmtMoney(income+salesTotal-expense)}</div><div class="label">Net</div></div>
      </div>
      <div class="add-form">
        <input type="date" id="bkDate"><select id="bkType"><option value="expense">Expense</option><option value="income">Income</option></select>
        <input type="text" id="bkCategory" placeholder="Category">
        <input type="number" step="0.01" id="bkAmount" placeholder="Amount">
        <input type="text" id="bkNote" placeholder="Note">
        <button class="mini" onclick="addBookkeeping()">Add</button>
      </div>
      ${items.length ? items.map(i=>`
        <div class="row"><div style="flex:1"><div class="title">${esc(i.category||i.type)} — ${i.type==='income'?'+':'-'}${fmtMoney(i.amount)}</div>
        <div class="meta">${esc(i.date||'')}${i.note?' · '+esc(i.note):''}${i.added_by?' · '+esc(i.added_by):''}</div></div>
        <button class="mini ghost" onclick="deleteRow('bookkeeping','${i.id}')">Delete</button></div>`).join('') : '<div class="empty">No entries yet.</div>'}
    </div>`;
}
async function addBookkeeping(){
  const amount = parseFloat(document.getElementById('bkAmount').value); if(isNaN(amount)) return;
  const date = document.getElementById('bkDate').value || todayStr();
  const type = document.getElementById('bkType').value;
  const category = document.getElementById('bkCategory').value.trim();
  const note = document.getElementById('bkNote').value.trim();
  await sb.from('bookkeeping').insert({ date, type, category, amount, note, added_by: currentUser.name });
  document.getElementById('bkAmount').value=''; document.getElementById('bkCategory').value=''; document.getElementById('bkNote').value='';
}

// ---------------- STAFF & PAY ----------------
function renderStaff(){
  const items = state.shifts;
  const eventOptions = state.calendar.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const owed = items.filter(s=>s.paid_status!=='paid').reduce((a,b)=>a+(Number(b.pay_amount)||0),0);
  document.getElementById('panel-staff').innerHTML = `
    <div class="card">
      <h2>Staff Hours &amp; Pay</h2>
      <div class="sub">Total unpaid owed: <b>${fmtMoney(owed)}</b></div>
      <div class="add-form" style="flex-wrap:wrap;">
        <select id="shiftPerson"><option value="Dalila">Dalila</option><option value="Kaylee">Kaylee</option><option value="Albert">Albert</option></select>
        <input type="date" id="shiftDate">
        <select id="shiftEvent"><option value="">No event</option>${eventOptions}</select>
        <input type="number" step="0.25" id="shiftHours" placeholder="Hours">
        <input type="number" step="0.01" id="shiftRate" placeholder="Pay rate/hr">
        <button class="mini" onclick="addShift()">Add shift</button>
      </div>
      ${items.length ? items.map(s=>`
        <div class="row">
          <span class="pill ${s.paid_status==='paid'?'paid':'unpaid'}">${esc(s.paid_status||'unpaid')}</span>
          <div style="flex:1"><div class="title">${esc(s.person)} — ${esc(s.hours)}h @ ${fmtMoney(s.pay_rate)}/hr = ${fmtMoney(s.pay_amount)}</div>
          <div class="meta">${esc(s.shift_date||'')}</div></div>
          <button class="mini" onclick="toggleShiftPaid('${s.id}','${s.paid_status==='paid'?'unpaid':'paid'}')">${s.paid_status==='paid'?'Mark unpaid':'Mark paid'}</button>
          <button class="mini ghost" onclick="deleteRow('shifts','${s.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No shifts logged yet.</div>'}
    </div>`;
}
async function addShift(){
  const person = document.getElementById('shiftPerson').value;
  const shift_date = document.getElementById('shiftDate').value || null;
  const event_id = document.getElementById('shiftEvent').value || null;
  const hours = parseFloat(document.getElementById('shiftHours').value)||0;
  const pay_rate = parseFloat(document.getElementById('shiftRate').value)||0;
  const pay_amount = hours * pay_rate;
  await sb.from('shifts').insert({ person, shift_date, event_id, hours, pay_rate, pay_amount, paid_status:'unpaid' });
  document.getElementById('shiftHours').value=''; document.getElementById('shiftRate').value='';
}
async function toggleShiftPaid(id, status){ await sb.from('shifts').update({ paid_status: status }).eq('id', id); }

// ---------------- CUSTOMERS ----------------
function renderCustomers(){
  const items = state.customers;
  document.getElementById('panel-customers').innerHTML = `
    <div class="card">
      <h2>Customers</h2>
      <div class="sub">Repeat customers, catering leads, loyalty tracking.</div>
      <div class="add-form">
        <input type="text" id="custName" placeholder="Name">
        <input type="text" id="custContact" placeholder="Contact">
        <input type="text" id="custNotes" placeholder="Notes">
        <button class="mini" onclick="addCustomer()">Add</button>
      </div>
      ${items.length ? items.map(c=>`
        <div class="row">
          <div style="flex:1"><div class="title">${esc(c.name)} — ${esc(c.visit_count||0)} visits</div>
          <div class="meta">${esc(c.contact||'')}${c.last_visit?' · last visit '+esc(c.last_visit):''}${c.notes?' · '+esc(c.notes):''}</div></div>
          <button class="mini" onclick="bumpVisit('${c.id}', ${c.visit_count||0})">+1 visit</button>
          <button class="mini ghost" onclick="deleteRow('customers','${c.id}')">Delete</button>
        </div>`).join('') : '<div class="empty">No customers yet.</div>'}
    </div>`;
}
async function addCustomer(){
  const name = document.getElementById('custName').value.trim(); if(!name) return;
  const contact = document.getElementById('custContact').value.trim();
  const notes = document.getElementById('custNotes').value.trim();
  await sb.from('customers').insert({ name, contact, notes, visit_count:1, last_visit: todayStr() });
  document.getElementById('custName').value=''; document.getElementById('custContact').value=''; document.getElementById('custNotes').value='';
}
async function bumpVisit(id, current){ await sb.from('customers').update({ visit_count: current+1, last_visit: todayStr() }).eq('id', id); }

// ---------------- OWNERSHIP & SCHEDULE ----------------
function renderOwnership(){
  const o = state.ownership || {};
  document.getElementById('panel-ownership').innerHTML = `
    <div class="card">
      <h2>Ownership Split</h2>
      <div class="add-form">
        <input type="text" id="ownDalila" placeholder="Dalila %" value="${esc(o.dalila_pct||'')}">
        <input type="text" id="ownKaylee" placeholder="Kaylee %" value="${esc(o.kaylee_pct||'')}">
        <button class="mini" onclick="saveOwnership()">Save</button>
      </div>
      <textarea id="ownNotes" placeholder="Notes">${esc(o.notes||'')}</textarea>
      <button class="mini" style="margin-top:8px;" onclick="saveOwnershipNotes()">Save notes</button>
    </div>
    <div class="card">
      <h2>Operating Schedule</h2>
      <textarea id="scheduleNotes" placeholder="e.g. Thursday–Sunday, 4 days/week">${esc(o.schedule_notes||'')}</textarea>
      <button class="mini" style="margin-top:8px;" onclick="saveSchedule()">Save schedule</button>
    </div>
    <div class="card">
      <h2>Service Area</h2>
      <textarea id="serviceArea" placeholder="e.g. Austin, Kyle, Buda, Lakeway, Bee Cave &amp; surrounding Hill Country">${esc(o.service_area||'Austin, Kyle, Buda, Lakeway, Bee Cave & surrounding Hill Country')}</textarea>
      <button class="mini" style="margin-top:8px;" onclick="saveServiceArea()">Save service area</button>
    </div>`;
}
async function saveOwnership(){
  const dalila_pct = document.getElementById('ownDalila').value.trim();
  const kaylee_pct = document.getElementById('ownKaylee').value.trim();
  await sb.from('business_meta').update({ dalila_pct, kaylee_pct }).eq('id','ownership');
}
async function saveOwnershipNotes(){
  const notes = document.getElementById('ownNotes').value.trim();
  await sb.from('business_meta').update({ notes }).eq('id','ownership');
}
async function saveSchedule(){
  const schedule_notes = document.getElementById('scheduleNotes').value.trim();
  await sb.from('business_meta').update({ schedule_notes }).eq('id','ownership');
}
async function saveServiceArea(){
  const service_area = document.getElementById('serviceArea').value.trim();
  await sb.from('business_meta').update({ service_area }).eq('id','ownership');
}

// ---------------- SHARED ----------------
async function deleteRow(table, id){ await sb.from(table).delete().eq('id', id); }
</script>
